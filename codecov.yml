codecov:
  require_ci_to_pass: yes

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        # 100% — every file with executable code is fully covered (vitest
        # thresholds are also at 100%). New or modified code must stay at
        # 100% or the patch check fails.
        target: 100%
        informational: false

comment:
  layout: "condensed_header, diff, components"
  require_changes: true

ignore:
  - "src/frontend/main.tsx"
  - "src/frontend/App.tsx"
  - "src/**/*.d.ts"
  - "src/test/**"
  - "dist/**"
  - "coverage/**"
  # Pure type-declaration files — no executable statements to cover
  # (mirrors the exclude list in vitest.config.ts).
  - "src/frontend/types/api.ts"
  - "src/backend/types.ts"
